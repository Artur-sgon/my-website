<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sling Pendulum Simulator</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #e5e0d8; /* Paper background */
            cursor: none; /* Hide real cursor */
            user-select: none;
            touch-action: none;
        }
        canvas { display: block; }
    </style>
</head>
<body>

<canvas id="canvas"></canvas>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    let mouse = { x: 0, y: 0, lastX: 0, lastY: 0 };
    
    // Physics constants
    const gravity = 0.5;      
    const friction = 0.995;   // Very low friction for long pendulum swings
    const slingLength = 130;  
    const ballRadius = 8;

    let activeBall = null;
    let projectiles = [];

    class Ball {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            this.oldX = x;
            this.oldY = y;
            this.isCaught = true;
        }

        update() {
            if (this.isCaught) {
                // VERLET INTEGRATION
                // 1. Calculate velocity based on change in position
                let vx = (this.x - this.oldX) * friction;
                let vy = (this.y - this.oldY) * friction;

                // 2. Store current position
                this.oldX = this.x;
                this.oldY = this.y;

                // 3. Apply physics (Gravity + Velocity)
                this.x += vx;
                this.y += vy + gravity;

                // 4. THE PENDULUM CONSTRAINT
                // We calculate distance from mouse and "pull" the ball back if it exceeds slingLength
                const dx = this.x - mouse.x;
                const dy = this.y - mouse.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance > slingLength) {
                    const ratio = slingLength / distance;
                    // This creates the pivot effect. Lateral momentum is preserved, 
                    // only the radial distance is corrected.
                    this.x = mouse.x + dx * ratio;
                    this.y = mouse.y + dy * ratio;
                }
            } else {
                // PROJECTILE PHYSICS
                let vx = (this.x - this.oldX) * friction;
                let vy = (this.y - this.oldY) * friction;
                
                this.oldX = this.x;
                this.oldY = this.y;

                this.x += vx;
                this.y += vy + gravity;

                // Remove ball if it leaves the screen
                if (this.x < -100 || this.x > width + 100 || this.y < -100 || this.y > height + 100) {
                    return true; 
                }
            }
            return false;
        }

        draw() {
            // Draw String
            if (this.isCaught) {
                ctx.beginPath();
                ctx.lineWidth = 1.5;
                ctx.strokeStyle = "rgba(0,0,0,0.6)";
                ctx.moveTo(mouse.x, mouse.y);
                ctx.lineTo(this.x, this.y);
                ctx.stroke();
            }

            // Draw Ball
            ctx.beginPath();
            ctx.arc(this.x, this.y, ballRadius, 0, Math.PI * 2);
            ctx.fillStyle = "black";
            ctx.fill();
        }
    }

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }

    window.addEventListener('resize', resize);
    
    window.addEventListener('mousemove', e => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
    });

    window.addEventListener('mousedown', () => {
        // Start ball slightly offset so gravity has something to pull on
        activeBall = new Ball(mouse.x + 1, mouse.y);
    });

    window.addEventListener('mouseup', () => {
        if (activeBall) {
            activeBall.isCaught = false;
            projectiles.push(activeBall);
            activeBall = null;
        }
    });

    function drawCursor() {
        ctx.save();
        ctx.translate(mouse.x, mouse.y);
        ctx.beginPath();
        ctx.lineWidth = 2;
        ctx.strokeStyle = "black";
        ctx.fillStyle = "white";
        // Sketchy arrow shape from reference
        ctx.moveTo(0, 0);
        ctx.lineTo(0, 18);
        ctx.lineTo(5, 13);
        ctx.lineTo(11, 21);
        ctx.lineTo(14, 18);
        ctx.lineTo(8, 11);
        ctx.lineTo(15, 11);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();
    }

    function loop() {
        // Use a slightly transparent clear for a tiny bit of motion trail (optional)
        ctx.clearRect(0, 0, width, height);

        // Update flying balls
        projectiles = projectiles.filter(p => {
            const isFinished = p.update();
            p.draw();
            return !isFinished;
        });

        // Update current pendulum ball
        if (activeBall) {
            activeBall.update();
            activeBall.draw();
        }

        drawCursor();
        requestAnimationFrame(loop);
    }

    resize();
    loop();
</script>
</body>
</html>
