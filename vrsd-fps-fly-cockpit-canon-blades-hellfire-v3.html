<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AH-64 Apache Simulator</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; font-family: 'VT323', monospace; touch-action: none; background: #000; }
        
        #info {
            position: absolute; top: 20px; right: 20px; width: auto; min-width: 350px; 
            text-align: right; color: white; background-color: rgba(0, 0, 0, 0.8); 
            padding: 15px; z-index: 99; border: 2px solid #555; font-size: 1.1rem;
        }
        #info.collapsed #info-text, #info.collapsed #speed-gauge, #info.collapsed .settings-row { display: none; }
        #info.collapsed { min-width: 100px; padding: 10px; }
        
        .btn-container { margin-top: 10px; display: flex; gap: 10px; justify-content: flex-end; }
        .settings-row { margin-top: 5px; display: flex; align-items: center; justify-content: flex-end; gap: 10px; }
        
        button {
            background: #444; color: #fff; border: 1px solid #777;
            font-family: 'VT323', monospace; cursor: pointer; padding: 5px 15px; font-size: 1rem;
        }
        button:hover { background: #666; }
        
        input[type=range] { cursor: pointer; background: #444; }

        #speed-gauge { color: #00ff00; font-weight: bold; margin-top: 5px; display: block; }
        #canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; }
        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: white; background-color: rgba(0, 0, 0, 0.7); padding: 20px;
            border-radius: 10px; font-size: 1.5rem; z-index: 100;
        }

        #crosshair {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 40px; height: 40px;
            pointer-events: none; 
            display: block; 
            z-index: 50;
        }
        .ch-part { position: absolute; background: rgba(0, 255, 0, 0.8); box-shadow: 0 0 2px black; }
        .ch-top { width: 2px; height: 12px; top: 0; left: 19px; }
        .ch-bottom { width: 2px; height: 12px; bottom: 0; left: 19px; }
        .ch-left { width: 12px; height: 2px; left: 0; top: 19px; }
        .ch-right { width: 12px; height: 2px; right: 0; top: 19px; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div id="crosshair">
        <div class="ch-part ch-top"></div>
        <div class="ch-part ch-bottom"></div>
        <div class="ch-part ch-left"></div>
        <div class="ch-part ch-right"></div>
    </div>

    <div id="info">
        <div id="info-text">
            <span id="control-hint">W/S: Altitude | A/D: Slide | M-Click: Hellfire | L-Click: Gun</span><br>
            <b>Click screen to engage systems.</b> ESC to unlock.
        </div>
        <div id="speed-gauge">PWR: 0% | SPD: 0 | YAW: 0 | [FLY]</div>
        
        <div class="settings-row">
            <label for="bright-slider">BRIGHTNESS: </label>
            <input type="range" id="bright-slider" min="0" max="2" step="0.1" value="1">
        </div>
        <div class="settings-row">
            <label>SHADOWS: </label>
            <input type="checkbox" id="shadow-toggle" checked>
        </div>
        <div class="settings-row">
            <label>SWAP A/D & MOUSE: </label>
            <input type="checkbox" id="control-swap" checked>
        </div>

        <div class="btn-container">
            <button id="info-toggle">Close Controls</button>
        </div>
    </div>
    <div id="loading">Initialising Apache Systems...</div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/loaders/DRACOLoader.js"></script>

    <script>
        const player = {
            mode: 'fly', 
            velocity: new THREE.Vector3(), 
            euler: new THREE.Euler(0, 0, 0, 'YXZ'),
            flyPitch: 0, flyRoll: 0, lookPitch: 0, lookYaw: 0,
            forwardThrottle: 0, targetThrottle: 0,
            yawVelocity: 0, verticalVelocity: 0,
            cockpitOffset: new THREE.Vector3(0, 0, 0), 
            keys: { forward: false, backward: false, left: false, right: false, jump: false, shift: false },
            lockControls: false,
            swapControls: true 
        };

        const weapon = {
            isFiring: false, lastFired: 0, fireRate: 120, speed: 4.0, spread: 0.04, 
            bullets: [], explosions: [], smokeParticles: [], template: null,
            burstTexture: null, smokeTexture: null 
        };

        const missile = {
            active: [], template: null, trailTexture: null, lastFired: 0,
            fireRate: 1500, speed: 2.0, wingSide: 1 
        };

        const infoBar = document.getElementById('info');
        const infoToggle = document.getElementById('info-toggle');
        const brightSlider = document.getElementById('bright-slider');
        const shadowToggle = document.getElementById('shadow-toggle');
        const swapControlToggle = document.getElementById('control-swap');
        const crosshair = document.getElementById('crosshair');

        infoToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            infoBar.classList.toggle('collapsed');
            infoToggle.textContent = infoBar.classList.contains('collapsed') ? 'Show' : 'Close Controls';
        });

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.01, 2000);
        const listener = new THREE.AudioListener();
        camera.add(listener);

        const soundRotor = new THREE.Audio(listener);
        const soundCannon = new THREE.Audio(listener);
        let bufferLaunch = null;
        let bufferBoom = null;

        const audioLoader = new THREE.AudioLoader();
        audioLoader.load('https://raw.githubusercontent.com/Artur-sgon/my-website/refs/heads/main/vrsd_fps_versions/SoundFX/rotor_cockpit.mp3', (buffer) => {
            soundRotor.setBuffer(buffer);
            soundRotor.setLoop(true);
            soundRotor.setVolume(0.2); 
        });
        audioLoader.load('https://raw.githubusercontent.com/Artur-sgon/my-website/refs/heads/main/vrsd_fps_versions/SoundFX/cannon.mp3', (buffer) => {
            soundCannon.setBuffer(buffer);
            soundCannon.setLoop(true);
            soundCannon.setVolume(0.4);
        });
        audioLoader.load('https://raw.githubusercontent.com/Artur-sgon/my-website/refs/heads/main/vrsd_fps_versions/SoundFX/missile_launch.mp3', (b) => bufferLaunch = b);
        audioLoader.load('https://raw.githubusercontent.com/Artur-sgon/my-website/refs/heads/main/vrsd_fps_versions/SoundFX/boom.mp3', (b) => bufferBoom = b);

        function playSound(buffer, volume = 1.0) {
            if (!buffer) return;
            const sound = new THREE.Audio(listener);
            sound.setBuffer(buffer);
            sound.setVolume(volume);
            sound.play();
        }

        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas'), antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        const ambientLight = new THREE.AmbientLight(0xffde77, 0.2); 
        scene.add(ambientLight);
        const sun = new THREE.DirectionalLight(0xffff86, 0.7); 
        sun.position.set(70, 70, -20);
        sun.castShadow = true;
        sun.shadow.mapSize.set(4096, 4096);
        scene.add(sun);
        const hemisphereLight = new THREE.HemisphereLight(0xffff88, 0x080820, 0.2); 
        scene.add(hemisphereLight);

        brightSlider.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            ambientLight.intensity = 0.2 * val;
            sun.intensity = 0.7 * val;
            hemisphereLight.intensity = 0.2 * val;
        });
        shadowToggle.addEventListener('change', (e) => { sun.castShadow = e.target.checked; });
        swapControlToggle.addEventListener('change', (e) => { player.swapControls = e.target.checked; player.yawVelocity = 0; player.flyRoll = 0; });

        let cockpit = null;
        let blades = null;
        let bladeAngle = 0;
        let collisionObjects = [];
        const loader = new THREE.GLTFLoader();
        const draco = new THREE.DRACOLoader();
        draco.setDecoderPath('https://www.gstatic.com/draco/v1/decoders/');
        loader.setDRACOLoader(draco);
        const textureLoader = new THREE.TextureLoader();
        
        // Asset Loading
        loader.load('https://raw.githubusercontent.com/Artur-sgon/my-website/refs/heads/main/vrsd_v1_textures_1_apache_grass_trees.glb', (gltf) => {
            gltf.scene.traverse(c => { if(c.isMesh) { c.castShadow = true; c.receiveShadow = true; collisionObjects.push(c); } });
            scene.add(gltf.scene);
            document.getElementById('loading').style.display = 'none';
        });

        loader.load('https://raw.githubusercontent.com/Artur-sgon/my-website/refs/heads/main/ah-64-apache-cockpit.glb', (gltf) => {
            cockpit = gltf.scene;
            cockpit.traverse(c => { if (c.isMesh) { c.material.side = THREE.DoubleSide; c.castShadow = true; c.receiveShadow = true; } });
            cockpit.visible = true;
            scene.add(cockpit);
        });

        loader.load('https://raw.githubusercontent.com/Artur-sgon/my-website/refs/heads/main/ah-64-apache-blades.glb', (gltf) => {
            blades = gltf.scene;
            blades.traverse(c => { if (c.isMesh) { c.material.transparent = true; c.castShadow = true; } });
            blades.visible = true;
            scene.add(blades);
        });

        loader.load('https://raw.githubusercontent.com/Artur-sgon/my-website/refs/heads/main/apache_bullet.glb', (gltf) => {
            weapon.template = gltf.scene;
            weapon.template.scale.set(0.3, 0.3, 1);
        });

        loader.load('https://raw.githubusercontent.com/Artur-sgon/my-website/refs/heads/main/hellfire.glb', (gltf) => {
            missile.template = gltf.scene;
        });

        textureLoader.load('https://raw.githubusercontent.com/Artur-sgon/my-website/refs/heads/main/hit_burst.png', (t) => { weapon.burstTexture = t; t.repeat.set(1/7, 1); });
        textureLoader.load('https://raw.githubusercontent.com/Artur-sgon/my-website/refs/heads/main/smoke_a_32.png', (t) => weapon.smokeTexture = t);
        textureLoader.load('https://raw.githubusercontent.com/Artur-sgon/my-website/refs/heads/main/smoke_b_32.png', (t) => missile.trailTexture = t);
        
        const tFrag1 = textureLoader.load('https://raw.githubusercontent.com/Artur-sgon/my-website/refs/heads/main/dirt_particle_a.png');
        const tFrag2 = textureLoader.load('https://raw.githubusercontent.com/Artur-sgon/my-website/refs/heads/main/dirt_particle_b.png');
        const tSmokeExp = textureLoader.load('https://raw.githubusercontent.com/Artur-sgon/my-website/refs/heads/main/smoke_c_32.png');
        const tBurstExp = textureLoader.load('https://raw.githubusercontent.com/Artur-sgon/my-website/refs/heads/main/fiery_smoke_32.png');

        new THREE.TextureLoader().load('https://i.imgur.com/WN0Wmas.jpeg', (t) => {
            t.mapping = THREE.EquirectangularReflectionMapping;
            scene.background = t; scene.environment = t;
        });

        const ExplosionSystem = {
            particles: [],
            config: {
                fragA: { count: 40, speed: 0.7, size: 3.4, decay: 0.02, gravity: 0.034 },
                smoke: { count: 15, lift: 0.03, size: 3.8, decay: 0.014, grow: 1.009, spin: 0.06 },
                burst: { count: 30, speed: 0.3, size: 4.6, decay: 0.02 }
            },
            trigger: function(pos) {
                for (let i = 0; i < this.config.fragA.count; i++) {
                    const mat = new THREE.SpriteMaterial({ map: tFrag1, transparent: true, depthWrite: false });
                    const sprite = new THREE.Sprite(mat);
                    sprite.position.copy(pos);
                    sprite.scale.set(2,2,2);
                    scene.add(sprite);
                    const vel = new THREE.Vector3(Math.random()-0.5, Math.random(), Math.random()-0.5).multiplyScalar(this.config.fragA.speed);
                    this.particles.push({ type: 'frag', mesh: sprite, velocity: vel, life: 1.0 });
                }
                for (let i = 0; i < this.config.smoke.count; i++) {
                    const mat = new THREE.SpriteMaterial({ map: tSmokeExp, transparent: true, opacity: 0.8, depthWrite: false });
                    const sprite = new THREE.Sprite(mat);
                    sprite.position.copy(pos);
                    sprite.scale.set(4,4,4);
                    scene.add(sprite);
                    this.particles.push({ type: 'smoke', mesh: sprite, velocity: new THREE.Vector3(0, 0.05, 0), life: 1.0 });
                }
            },
            update: function() {
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const p = this.particles[i];
                    p.mesh.position.add(p.velocity);
                    if (p.type === 'frag') { p.velocity.y -= 0.03; p.life -= 0.02; }
                    else { p.mesh.scale.multiplyScalar(1.01); p.life -= 0.01; }
                    p.mesh.material.opacity = p.life;
                    if (p.life <= 0) { scene.remove(p.mesh); this.particles.splice(i, 1); }
                }
            }
        };

        const raycaster = new THREE.Raycaster();

        document.addEventListener('keydown', (e) => {
            if (e.code === 'KeyW') player.keys.forward = true;
            if (e.code === 'KeyS') player.keys.backward = true;
            if (e.code === 'KeyA') player.keys.left = true;
            if (e.code === 'KeyD') player.keys.right = true;
            if (e.shiftKey) player.keys.shift = true;
        });
        document.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW') player.keys.forward = false;
            if (e.code === 'KeyS') player.keys.backward = false;
            if (e.code === 'KeyA') player.keys.left = false;
            if (e.code === 'KeyD') player.keys.right = false;
            if (!e.shiftKey) { player.keys.shift = false; player.lookPitch = 0; player.lookYaw = 0; }
        });
        window.addEventListener('wheel', (e) => {
            player.targetThrottle = Math.max(0, Math.min(1.5, player.targetThrottle - e.deltaY * 0.0005));
        });

        document.getElementById('canvas').addEventListener('click', () => { 
            document.getElementById('canvas').requestPointerLock(); 
            if (listener.context.state === 'suspended') listener.context.resume();
            if (soundRotor.buffer && !soundRotor.isPlaying) soundRotor.play();
        });

        document.addEventListener('pointerlockchange', () => player.lockControls = document.pointerLockElement === document.getElementById('canvas'));

        document.addEventListener('mousedown', (e) => {
            if (!player.lockControls) return;
            if (e.button === 0) { weapon.isFiring = true; if (soundCannon.buffer && !soundCannon.isPlaying) soundCannon.play(); }
            if (e.button === 1) { e.preventDefault(); fireMissile(); }
        });

        document.addEventListener('mouseup', () => {
            weapon.isFiring = false;
            if (soundCannon.isPlaying) soundCannon.stop();
        });

        document.addEventListener('mousemove', (e) => {
            if (!player.lockControls) return;
            if (player.keys.shift) {
                player.lookYaw -= e.movementX * 0.002;
                player.lookPitch = Math.max(-1.2, Math.min(1.2, player.lookPitch - e.movementY * 0.002));
            } else {
                player.flyPitch = Math.max(-0.8, Math.min(0.8, player.flyPitch - e.movementY * 0.001));
                if (player.swapControls) player.yawVelocity -= e.movementX * 0.0001;
                else player.flyRoll = Math.max(-0.8, Math.min(0.8, player.flyRoll - e.movementX * 0.001));
            }
        });

        function fireMissile() {
            const now = Date.now();
            if (!missile.template || (now - missile.lastFired < missile.fireRate)) return;
            missile.lastFired = now;
            setTimeout(() => {
                const heliQ = new THREE.Quaternion().setFromEuler(new THREE.Euler(player.flyPitch, player.euler.y, player.flyRoll, 'YXZ'));
                const spawnOffset = new THREE.Vector3(2.5 * missile.wingSide, -1.5, 1.0).applyQuaternion(heliQ);
                const spawnPos = camera.position.clone().add(spawnOffset);
                const mMesh = missile.template.clone();
                mMesh.position.copy(spawnPos);
                const targetDir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion).normalize();
                mMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, -1), targetDir);
                scene.add(mMesh);
                missile.active.push({ mesh: mMesh, velocity: targetDir.multiplyScalar(missile.speed), life: 300 });
                playSound(bufferLaunch, 0.5);
                missile.wingSide *= -1;
            }, 300);
        }

        function createExplosion(pos) {
            if (weapon.burstTexture) {
                const tex = weapon.burstTexture.clone();
                const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, blending: THREE.AdditiveBlending });
                const sprite = new THREE.Sprite(mat);
                sprite.position.copy(pos);
                sprite.scale.set(3,3,3);
                scene.add(sprite);
                weapon.explosions.push({ mesh: sprite, texture: tex, currentFrame: 0, lastFrameTime: Date.now(), frameDuration: 30 });
            }
        }

        function update() {
            const now = Date.now();
            ExplosionSystem.update();

            player.forwardThrottle += (player.targetThrottle - player.forwardThrottle) * 0.005;
            if (player.keys.forward) player.verticalVelocity += 0.006;
            else if (player.keys.backward) player.verticalVelocity -= 0.006;
            player.verticalVelocity *= 0.96; camera.position.y += player.verticalVelocity;
            
            if (player.swapControls) {
                if (player.keys.left) player.flyRoll = Math.min(player.flyRoll + 0.02, 0.5);
                else if (player.keys.right) player.flyRoll = Math.max(player.flyRoll - 0.02, -0.5);
                else player.flyRoll *= 0.92;
                player.euler.y += player.yawVelocity;
                player.yawVelocity *= 0.96;
            } else {
                if (player.keys.left) player.yawVelocity += 0.0015;
                else if (player.keys.right) player.yawVelocity -= 0.0015;
                player.yawVelocity *= 0.94;
                player.euler.y += player.yawVelocity;
            }

            const curYaw = new THREE.Euler(0, player.euler.y, 0);
            const fwd = new THREE.Vector3(0,0,-1).applyQuaternion(new THREE.Quaternion().setFromEuler(curYaw));
            const sid = new THREE.Vector3(1,0,0).applyQuaternion(new THREE.Quaternion().setFromEuler(curYaw));
            camera.position.addScaledVector(fwd, player.forwardThrottle + (-player.flyPitch * 0.25));
            camera.position.addScaledVector(sid, -player.flyRoll * 0.25);

            const heliQ = new THREE.Quaternion().setFromEuler(new THREE.Euler(player.flyPitch, player.euler.y, player.flyRoll, 'YXZ'));
            const headQ = new THREE.Quaternion().setFromEuler(new THREE.Euler(player.lookPitch, player.lookYaw, 0, 'YXZ'));
            camera.quaternion.multiplyQuaternions(heliQ, headQ);

            if (cockpit) {
                cockpit.quaternion.copy(heliQ);
                cockpit.position.copy(camera.position);
            }

            if (blades) {
                bladeAngle += 0.4;
                const bladeOffset = new THREE.Vector3(0, 2, 1.5).applyQuaternion(heliQ);
                blades.position.copy(camera.position).add(bladeOffset);
                blades.quaternion.copy(heliQ).multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), bladeAngle));
                blades.traverse(c => { if(c.isMesh) c.material.opacity = 0.3 + 0.2 * Math.sin(bladeAngle); });
            }

            // Weapons Update
            if (weapon.isFiring && weapon.template && (now - weapon.lastFired > weapon.fireRate)) {
                const spawnPos = camera.position.clone().add(new THREE.Vector3(0, -2, -3).applyQuaternion(heliQ));
                const bulletMesh = weapon.template.clone();
                bulletMesh.position.copy(spawnPos);
                const velocity = new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion).multiplyScalar(weapon.speed);
                bulletMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,-1), velocity.clone().normalize());
                scene.add(bulletMesh);
                weapon.bullets.push({ mesh: bulletMesh, velocity: velocity, life: 100 });
                weapon.lastFired = now;
            }

            for (let i = weapon.bullets.length - 1; i >= 0; i--) {
                const b = weapon.bullets[i];
                raycaster.set(b.mesh.position, b.velocity.clone().normalize());
                const hits = raycaster.intersectObjects(collisionObjects);
                if (hits.length > 0 && hits[0].distance <= b.velocity.length()) {
                    createExplosion(hits[0].point);
                    scene.remove(b.mesh); weapon.bullets.splice(i, 1);
                } else {
                    b.mesh.position.add(b.velocity);
                    if (--b.life <= 0) { scene.remove(b.mesh); weapon.bullets.splice(i, 1); }
                }
            }

            for (let i = missile.active.length - 1; i >= 0; i--) {
                const m = missile.active[i];
                raycaster.set(m.mesh.position, m.velocity.clone().normalize());
                const hits = raycaster.intersectObjects(collisionObjects);
                if (hits.length > 0 && hits[0].distance <= m.velocity.length()) {
                    const hitPos = hits[0].point;
                    ExplosionSystem.trigger(hitPos);
                    const dist = camera.position.distanceTo(hitPos);
                    setTimeout(() => playSound(bufferBoom, 1.0 - (dist/1000)), (dist/343)*1000);
                    scene.remove(m.mesh); missile.active.splice(i, 1);
                } else {
                    m.mesh.position.add(m.velocity);
                    if (--m.life <= 0) { scene.remove(m.mesh); missile.active.splice(i, 1); }
                }
            }

            // Sprite Anim
            for (let i = weapon.explosions.length - 1; i >= 0; i--) {
                const exp = weapon.explosions[i];
                if (now - exp.lastFrameTime > exp.frameDuration) {
                    if (++exp.currentFrame > 6) { scene.remove(exp.mesh); weapon.explosions.splice(i, 1); }
                    else { exp.texture.offset.x = exp.currentFrame / 7; exp.lastFrameTime = now; }
                }
            }

            document.getElementById('speed-gauge').textContent = `PWR: ${(player.targetThrottle*100).toFixed(0)}% | SPD: ${(player.forwardThrottle*100).toFixed(0)} | V-LIFT: ${(player.verticalVelocity*400).toFixed(0)} | ${player.keys.shift ? '[LOOK]' : '[FLY]'}`;
        }

        function animate() { requestAnimationFrame(animate); update(); renderer.render(scene, camera); }
        camera.position.set(155, 10, 8);
        animate();
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
