<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D First Person Environment</title>
    <!-- Import Pixel Font -->
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'VT323', monospace; /* Updated Font */
            touch-action: none;
        }
        /* Moved Info Bar to Bottom with Toggle Logic */
        #info {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: auto;
            min-width: 400px;
            text-align: center;
            color: white;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            z-index: 99;
            border: 2px solid #555;
            font-size: 1.2rem;
        }
        #info.collapsed #info-text {
            display: none;
        }
        #info.collapsed {
            min-width: 100px;
            padding: 5px;
        }
        #info-toggle {
            background: #444;
            color: #fff;
            border: 1px solid #777;
            font-family: 'VT323', monospace;
            cursor: pointer;
            margin-top: 5px;
            padding: 2px 10px;
        }
        #info-toggle:hover {
            background: #666;
        }

        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            font-size: 1.5rem;
            z-index: 100;
            font-family: 'VT323', monospace;
        }
        
        /* Force Dat.GUI to use the pixel font */
        .dg.main, .dg .property-name, .dg .c, .dg .slider {
            font-family: 'VT323', monospace !important;
            font-size: 1.1rem !important;
        }

        /* Mobile Controls */
        .joystick {
            position: fixed;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            touch-action: none;
            display: none;
        }
        #joystick-left { bottom: 30px; left: 30px; }
        #joystick-right { bottom: 30px; right: 30px; }
        #jump-button {
            position: fixed;
            bottom: 30px;
            right: 160px;
            font-size: 24px;
            background: rgba(0, 255, 0, 0.5);
            padding: 15px 25px;
            border-radius: 10px;
            touch-action: none;
            display: none;
        }
        @media (max-width: 768px) {
            #info { font-size: 1rem; min-width: 90%; }
            .joystick, #jump-button { display: block; }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div id="info">
        <div id="info-text">
            WASD to move, Mouse to look around, SPACE to jump, R to toggle run. Click to start.<br>
            Press ESC to unlock mouse cursor.
        </div>
        <button id="info-toggle">Close Controls</button>
    </div>

    <div id="loading">Loading 3D Environment...</div>
    
    <!-- Mobile Controls -->
    <div id="joystick-left" class="joystick"></div>
    <div id="joystick-right" class="joystick"></div>
    <div id="jump-button">↑</div>
    
    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.7/dat.gui.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/shaders/SAOShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/shaders/DepthLimitedBlurShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/shaders/UnpackDepthRGBAShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/postprocessing/SAOPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r132/loaders/OBJLoader.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r132/loaders/FBXLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/loaders/DRACOLoader.js"></script>

    <script>
        // Info Bar Toggle logic
        const infoBar = document.getElementById('info');
        const infoToggle = document.getElementById('info-toggle');
        infoToggle.addEventListener('click', (e) => {
            e.stopPropagation(); // Prevent locking cursor when clicking button
            infoBar.classList.toggle('collapsed');
            infoToggle.textContent = infoBar.classList.contains('collapsed') ? 'Show Controls' : 'Close Controls';
        });

        const canvas = document.getElementById('canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ 
            canvas, 
            antialias: true,
            powerPreference: "high-performance"
        });
        
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        let composer = null;
        let saoPass = null;
        let renderPass = null;
        let aoMultiplyPass = null;
        
        const CustomAOMultiplyShader = {
            uniforms: {
                "tDiffuse": { value: null },
                "tAO": { value: null },
                "opacity": { value: 1.0 }
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform sampler2D tDiffuse;
                uniform sampler2D tAO;
                uniform float opacity;
                varying vec2 vUv;
                
                void main() {
                    vec4 texel = texture2D(tDiffuse, vUv);
                    vec4 ao = texture2D(tAO, vUv);
                    gl_FragColor = vec4(texel.rgb * ao.rgb, texel.a);
                }
            `
        };
        
        function initPostProcessing() {
            const renderTarget = new THREE.WebGLRenderTarget(
                window.innerWidth, 
                window.innerHeight,
                { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, format: THREE.RGBAFormat, encoding: THREE.sRGBEncoding }
            );
            
            composer = new THREE.EffectComposer(renderer, renderTarget);
            renderPass = new THREE.RenderPass(scene, camera);
            composer.addPass(renderPass);
            
            saoPass = new THREE.SAOPass(scene, camera, false, true);
            saoPass.params = {
                saoBias: 0.5,
                saoIntensity: 0.001,
                saoScale: 3,
                saoKernelRadius: 20,
                saoMinResolution: 0,
                saoBlur: true,
                saoBlurRadius: 6,
                saoBlurStdDev: 1,
                saoBlurDepthCutoff: 0.01
            };

            saoPass.enabled = false;
            composer.addPass(saoPass);
            
            aoMultiplyPass = new THREE.ShaderPass(CustomAOMultiplyShader);
            aoMultiplyPass.renderToScreen = true;
            aoMultiplyPass.enabled = false; 
            composer.addPass(aoMultiplyPass);
            
            // GUI Setup with AO Toggle
            const gui = new dat.GUI();
            const aoFolder = gui.addFolder('Graphics Setup');
            aoFolder.add(saoPass, 'enabled').name('AO Enabled').onChange((val) => {
                aoMultiplyPass.enabled = val;
            });
            aoFolder.add(saoPass.params, 'saoIntensity', 0, 1).name('AO Intensity');
            aoFolder.add(saoPass.params, 'saoKernelRadius', 10, 200).name('AO Radius');
            aoFolder.add(saoPass.params, 'saoScale', 0.1, 2).name('AO Scale');
            aoFolder.open();
        }
        
        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffde77, 0.2);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffff86, 0.7);
        directionalLight.position.set(70, 70, -20);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 4096;
        directionalLight.shadow.mapSize.height = 4096;
        directionalLight.shadow.bias = -0.001;
        scene.add(directionalLight);

        const hemisphereLight = new THREE.HemisphereLight(0xffff88, 0x080820, 0.2);
        scene.add(hemisphereLight);

        const loader = new THREE.TextureLoader();
        loader.load('https://i.imgur.com/WN0Wmas.jpeg', function(texture) {
            document.getElementById('loading').textContent = 'Loading 3D model...';
            texture.mapping = THREE.EquirectangularReflectionMapping;
            texture.center.set(0.5, 0.5);
            texture.rotation = Math.PI * 1.5;
            scene.background = texture;
            scene.environment = texture;
        });
        
        const raycaster = new THREE.Raycaster();
        let collisionObjects = [];
        
        const player = {
            height: 1.8,
            speed: 0.15,
            turnSpeed: 0.002,
            jumpForce: 0.5,
            jumpCount: 0,
            maxJumps: 2,
            velocity: new THREE.Vector3(),
            gravity: -0.02,
            groundCheckDistance: 0.25,
            isGrounded: false,
            jumpCooldown: false,
            isRunning: false,
            walkSpeed: 0.15,
            runSpeed: 0.3,
            keys: { forward: false, backward: false, left: false, right: false, jump: false },
            euler: new THREE.Euler(0, 0, 0, 'YXZ'),
            lockControls: false,
            touch: {
                leftStick: { x: 0, y: 0 },
                rightStick: { x: 0, y: 0 },
                isMobile: /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent),
                jumpPressed: false
            }
        };
        
        camera.position.set(155, 6, 8);
        
        const loadingManager = new THREE.LoadingManager();
        loadingManager.onLoad = () => {
            document.getElementById('loading').style.display = 'none';
            initPostProcessing();
        };
        
        function loadModel(modelPath) {
            const loader = new THREE.GLTFLoader(loadingManager);
            const dracoLoader = new THREE.DRACOLoader();
            dracoLoader.setDecoderPath('https://www.gstatic.com/draco/v1/decoders/');
            loader.setDRACOLoader(dracoLoader);
            
            loader.load(modelPath, function(object) {
                const model = object.scene;
                model.scale.set(1.16, 1.16, 1.16);
                model.traverse(function(child) {
                    if (child.isMesh) {
                        child.material.aoMapIntensity = 1;
                        child.castShadow = true;
                        child.receiveShadow = true;
                        collisionObjects.push(child);
                    }
                });
                scene.add(model);
            });
        }
        
        loadModel('https://raw.githubusercontent.com/Artur-sgon/my-website/refs/heads/main/vrsd_v1_textures_1_trees_apache.glb');
        
        if (player.touch.isMobile) {
            setupJoystick(document.getElementById('joystick-left'), (x, y) => {
                player.touch.leftStick.x = x;
                player.touch.leftStick.y = y;
            });
            setupJoystick(document.getElementById('joystick-right'), (x, y) => {
                player.touch.rightStick.x = x * 0.02;
                player.touch.rightStick.y = y * 0.02;
            });
            const jumpBtn = document.getElementById('jump-button');
            jumpBtn.addEventListener('touchstart', (e) => { e.preventDefault(); player.touch.jumpPressed = true; });
            jumpBtn.addEventListener('touchend', (e) => { e.preventDefault(); player.touch.jumpPressed = false; });
        }
        
        function setupJoystick(element, callback) {
            let touchId = null;
            const rect = element.getBoundingClientRect();
            const center = { x: rect.width / 2, y: rect.height / 2 };
            const maxDist = center.x * 0.7;
            element.addEventListener('touchstart', (e) => { if (touchId === null) { touchId = e.changedTouches[0].identifier; e.preventDefault(); } });
            element.addEventListener('touchmove', (e) => {
                for (let touch of e.changedTouches) {
                    if (touch.identifier === touchId) {
                        let x = Math.max(-1, Math.min(1, (touch.clientX - rect.left - center.x) / maxDist));
                        let y = Math.max(-1, Math.min(1, (touch.clientY - rect.top - center.y) / maxDist));
                        callback(x, y);
                        e.preventDefault();
                    }
                }
            });
            element.addEventListener('touchend', (e) => {
                for (let touch of e.changedTouches) { if (touch.identifier === touchId) { callback(0, 0); touchId = null; e.preventDefault(); } }
            });
        }
        
        function checkCollisions(moveX, moveZ) {
            const checkPoints = [new THREE.Vector3(0.3, 0, 0.3), new THREE.Vector3(-0.3, 0, 0.3), new THREE.Vector3(0, 0, 0)];
            let canMove = true;
            checkPoints.forEach(point => {
                const origin = new THREE.Vector3().copy(camera.position).add(point);
                if (moveZ !== 0) {
                    raycaster.ray.origin.copy(origin);
                    raycaster.ray.direction.set(0, 0, moveZ > 0 ? 1 : -1);
                    if (raycaster.intersectObjects(collisionObjects).length > 0 && raycaster.intersectObjects(collisionObjects)[0].distance < 0.5) canMove = false;
                }
                if (moveX !== 0) {
                    raycaster.ray.origin.copy(origin);
                    raycaster.ray.direction.set(moveX > 0 ? 1 : -1, 0, 0);
                    if (raycaster.intersectObjects(collisionObjects).length > 0 && raycaster.intersectObjects(collisionObjects)[0].distance < 0.5) canMove = false;
                }
            });
            return canMove;
        }

        document.addEventListener('keydown', (e) => {
            switch (e.code) {
                case 'KeyW': player.keys.forward = true; break;
                case 'KeyS': player.keys.backward = true; break;
                case 'KeyA': player.keys.left = true; break;
                case 'KeyD': player.keys.right = true; break;
                case 'KeyR': player.isRunning = !player.isRunning; break;
                case 'Space': player.keys.jump = true; break;
            }
        });
        
        document.addEventListener('keyup', (e) => {
            switch (e.code) {
                case 'KeyW': player.keys.forward = false; break;
                case 'KeyS': player.keys.backward = false; break;
                case 'KeyA': player.keys.left = false; break;
                case 'KeyD': player.keys.right = false; break;
                case 'Space': player.keys.jump = false; break;
                case 'Escape': player.lockControls = false; document.exitPointerLock(); break;
            }
        });
        
        canvas.addEventListener('click', () => {
            if (!player.lockControls && !player.touch.isMobile) canvas.requestPointerLock();
        });
        
        document.addEventListener('pointerlockchange', () => player.lockControls = document.pointerLockElement === canvas);
        
        document.addEventListener('mousemove', (e) => {
            if (player.lockControls && !player.touch.isMobile) {
                player.euler.y -= (e.movementX || 0) * player.turnSpeed;
                player.euler.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, player.euler.x - (e.movementY || 0) * player.turnSpeed));
                camera.quaternion.setFromEuler(player.euler);
            }
        });
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            if (composer) composer.setSize(window.innerWidth, window.innerHeight);
        });
        
        const animate = () => {
            requestAnimationFrame(animate);
            raycaster.ray.origin.copy(camera.position);
            raycaster.ray.direction.set(0, -1, 0);
            const groundIntersects = raycaster.intersectObjects(collisionObjects);
            player.isGrounded = false;
            if (groundIntersects.length > 0) {
                player.isGrounded = groundIntersects[0].distance < player.height + player.groundCheckDistance;
                if (player.isGrounded && player.velocity.y <= 0) {
                    camera.position.y = groundIntersects[0].point.y + player.height;
                    player.velocity.y = 0;
                    player.jumpCooldown = false;
                }
            }

            if (!player.isGrounded) player.velocity.y = Math.max(player.velocity.y + player.gravity, -0.5);
            if ((player.keys.jump || player.touch.jumpPressed) && (player.isGrounded || player.jumpCount < player.maxJumps) && !player.jumpCooldown) {
                player.velocity.y = player.jumpForce;
                player.jumpCount++;
                player.isGrounded = false;
                player.jumpCooldown = true;
                setTimeout(() => player.jumpCooldown = false, 100);
            }
            if (player.isGrounded) player.jumpCount = 0;

            if (player.lockControls || player.touch.isMobile) {
                const speed = player.isRunning ? player.runSpeed : player.walkSpeed;
                let moveZ = player.touch.isMobile ? -player.touch.leftStick.y * speed : (Number(player.keys.forward) - Number(player.keys.backward)) * speed;
                let moveX = player.touch.isMobile ? player.touch.leftStick.x * speed : (Number(player.keys.right) - Number(player.keys.left)) * speed;

                if (checkCollisions(moveX, moveZ)) {
                    const dir = new THREE.Vector3();
                    camera.getWorldDirection(dir);
                    dir.y = 0; dir.normalize();
                    const side = new THREE.Vector3(-dir.z, 0, dir.x);
                    camera.position.x += moveX * side.x + moveZ * dir.x;
                    camera.position.z += moveX * side.z + moveZ * dir.z;
                }
                if (player.touch.isMobile && (Math.abs(player.touch.rightStick.x) > 0.01 || Math.abs(player.touch.rightStick.y) > 0.01)) {
                    player.euler.y -= player.touch.rightStick.x;
                    player.euler.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, player.euler.x - player.touch.rightStick.y));
                    camera.quaternion.setFromEuler(player.euler);
                }
            }
            camera.position.y += player.velocity.y;
            
            if (composer) {
                if (aoMultiplyPass.enabled && saoPass) aoMultiplyPass.uniforms["tAO"].value = saoPass.beautyRenderTarget.texture;
                composer.render();
            } else {
                renderer.render(scene, camera);
            }
        };
        animate();
    </script>
</body>
</html>
