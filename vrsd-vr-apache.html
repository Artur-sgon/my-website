<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AH-64 Apache VR Simulator</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; font-family: 'VT323', monospace; background: #000; }
        #loading { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: #000; color: white; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 1000;
        }
        #manual-vr-start {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 30px 60px; font-size: 2.5rem; font-family: 'VT323', monospace;
            background: #2ecc71; color: white; border: 5px solid #fff; border-radius: 15px;
            cursor: pointer; z-index: 2000; display: none; box-shadow: 0 0 40px rgba(46, 204, 113, 0.8);
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div id="loading">
        <h1 id="load-status">Initialising Apache Systems...</h1>
    </div>

    <button id="manual-vr-start">Engage VR Flight</button>

    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/loaders/DRACOLoader.js"></script>

    <script>
        // --- SCENE SETUP ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 50000);
        const playerGroup = new THREE.Group();
        playerGroup.position.set(155, 20, 30); 
        playerGroup.add(camera);
        scene.add(playerGroup);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.xr.enabled = true;
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // --- AUDIO ---
        const listener = new THREE.AudioListener();
        camera.add(listener);
        const soundRotor = new THREE.Audio(listener);
        const soundCannon = new THREE.Audio(listener);
        let bufferLaunch = null, bufferBoom = null;

        const audioLoader = new THREE.AudioLoader();
        audioLoader.load('https://raw.githubusercontent.com/Artur-sgon/my-website/refs/heads/main/vrsd_fps_versions/SoundFX/rotor_cockpit.mp3', (b) => {
            soundRotor.setBuffer(b); soundRotor.setLoop(true); soundRotor.setVolume(0.3);
        });
        audioLoader.load('https://raw.githubusercontent.com/Artur-sgon/my-website/refs/heads/main/vrsd_fps_versions/SoundFX/cannon.mp3', (b) => {
            soundCannon.setBuffer(b); soundCannon.setLoop(true); soundCannon.setVolume(0.5);
        });
        audioLoader.load('https://raw.githubusercontent.com/Artur-sgon/my-website/refs/heads/main/vrsd_fps_versions/SoundFX/missile_launch.mp3', (b) => bufferLaunch = b);
        audioLoader.load('https://raw.githubusercontent.com/Artur-sgon/my-website/refs/heads/main/vrsd_fps_versions/SoundFX/boom.mp3', (b) => bufferBoom = b);

        function playOneShot(buffer, vol = 1.0) {
            if(!buffer) return;
            const s = new THREE.Audio(listener);
            s.setBuffer(buffer); s.setVolume(vol); s.play();
        }

        // --- APACHE STATE ---
        const flight = {
            pitch: 0, roll: 0, yaw: 0,
            throttle: 0.7, targetThrottle: 0.7, // Set to 0.7 to hover immediately
            vVelocity: 0, yawVelocity: 0,
            bladeAngle: 0
        };

        const weapon = {
            isFiring: false, lastFired: 0, fireRate: 120, bullets: [], explosions: [],
            template: null, burstTexture: null
        };

        const missile = {
            active: [], template: null, lastFired: 0, fireRate: 2000, wingSide: 1
        };

        // --- ASSET LOADING ---
        const manager = new THREE.LoadingManager();
        const statusText = document.getElementById('load-status');
        manager.onProgress = (u, l, t) => statusText.innerText = `Loading Assets: ${Math.round((l/t)*100)}%`;
        manager.onLoad = () => {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('manual-vr-start').style.display = 'block';
        };

        const loader = new THREE.GLTFLoader(manager);
        const draco = new THREE.DRACOLoader();
        draco.setDecoderPath('https://www.gstatic.com/draco/v1/decoders/');
        loader.setDRACOLoader(draco);

        let cockpit = null, blades = null, collisionObjects = [];

        // World
        loader.load('https://raw.githubusercontent.com/Artur-sgon/my-website/refs/heads/main/land.glb', (gltf) => {
            gltf.scene.traverse(c => { if(c.isMesh) { c.receiveShadow = true; collisionObjects.push(c); } });
            scene.add(gltf.scene);
        });

        // Cockpit (Parented to PlayerGroup to stay with VR camera)
        loader.load('https://raw.githubusercontent.com/Artur-sgon/my-website/refs/heads/main/ah-64-apache-cockpit.glb', (gltf) => {
            cockpit = gltf.scene;
            cockpit.position.set(0, 1, 0); // Offset down so VR camera is in the pilot's head
            playerGroup.add(cockpit);
        });

        // Blades
        loader.load('https://raw.githubusercontent.com/Artur-sgon/my-website/refs/heads/main/ah-64-apache-blades.glb', (gltf) => {
            blades = gltf.scene;
            blades.traverse(c => { if(c.isMesh) c.material.transparent = true; });
            playerGroup.add(blades);
        });

        // Projectiles
        loader.load('https://raw.githubusercontent.com/Artur-sgon/my-website/refs/heads/main/apache_bullet.glb', (gltf) => {
            weapon.template = gltf.scene; weapon.template.scale.set(0.3, 0.3, 1);
        });
        loader.load('https://raw.githubusercontent.com/Artur-sgon/my-website/refs/heads/main/hellfire.glb', (gltf) => {
            missile.template = gltf.scene;
        });

        const texLoader = new THREE.TextureLoader(manager);
        texLoader.load('https://i.imgur.com/WN0Wmas.jpeg', (t) => {
            t.mapping = THREE.EquirectangularReflectionMapping;
            scene.background = t; scene.environment = t;
        });
        weapon.burstTexture = texLoader.load('https://raw.githubusercontent.com/Artur-sgon/my-website/refs/heads/main/hit_burst.png');
        weapon.burstTexture.repeat.set(1/7, 1);

        // Lighting
        scene.add(new THREE.AmbientLight(0xffffff, 0.4));
        const sun = new THREE.DirectionalLight(0xffffff, 0.8);
        sun.position.set(50, 100, 50);
        scene.add(sun);

        // --- VR SESSION ---
        const vrButton = document.getElementById('manual-vr-start');
        vrButton.addEventListener('click', () => {
            if (navigator.xr) {
                navigator.xr.requestSession('immersive-vr', { optionalFeatures: ['local-floor'] }).then(async (session) => {
                    await renderer.xr.setSession(session);
                    if(soundRotor.buffer) soundRotor.play();
                    vrButton.style.display = 'none';
                });
            }
        });

        const raycaster = new THREE.Raycaster();

        // --- RENDER LOOP ---
        renderer.setAnimationLoop(() => {
            const session = renderer.xr.getSession();
            const now = Date.now();

            if (session) {
                for (const source of session.inputSources) {
                    if (source.gamepad) {
                        const axes = source.gamepad.axes;
                        const buttons = source.gamepad.buttons;

                        // LEFT CONTROLLER: Throttle & Roll
                        if (source.handedness === 'left') {
                            flight.targetThrottle = THREE.MathUtils.lerp(0, 1.5, (1 - axes[3]) / 2); 
                            flight.roll = THREE.MathUtils.lerp(flight.roll, -axes[2] * 0.5, 0.1);
                        }

                        // RIGHT CONTROLLER: Pitch, Yaw & Weapons
                        if (source.handedness === 'right') {
                            flight.pitch = THREE.MathUtils.lerp(flight.pitch, axes[3] * 0.6, 0.1);
                            flight.yawVelocity = -axes[2] * 0.03;

                            // Cannon: Trigger
                            const trigger = buttons[0].pressed || buttons[1].pressed; 
                            if(trigger) {
                                weapon.isFiring = true;
                                if(!soundCannon.isPlaying) soundCannon.play();
                            } else {
                                weapon.isFiring = false;
                                if(soundCannon.isPlaying) soundCannon.stop();
                            }

                            // Missile: Grip or A button
                            if((buttons[4]?.pressed || buttons[2]?.pressed) && now - missile.lastFired > missile.fireRate) {
                                fireMissile();
                            }
                        }
                    }
                }

                // --- FLIGHT PHYSICS (Only runs during VR session) ---
                flight.throttle += (flight.targetThrottle - flight.throttle) * 0.02;
                flight.yaw += flight.yawVelocity;

                const heliRotation = new THREE.Quaternion().setFromEuler(new THREE.Euler(flight.pitch, flight.yaw, flight.roll, 'YXZ'));
                playerGroup.quaternion.copy(heliRotation);

                const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(heliRotation);
                const side = new THREE.Vector3(1, 0, 0).applyQuaternion(heliRotation);
                
                const forwardSpeed = flight.throttle + (-flight.pitch * 0.5);
                playerGroup.position.addScaledVector(fwd, forwardSpeed);
                playerGroup.position.addScaledVector(side, -flight.roll * 0.5);

                flight.vVelocity = (flight.throttle - 0.7) * 0.2; 
                playerGroup.position.y += flight.vVelocity;

                // --- ANIMATE BLADES ---
                if(blades) {
                    flight.bladeAngle += 0.5;
                    blades.rotation.y = flight.bladeAngle;
                    blades.position.set(0, 3.0, 1.5); // Adjusted to match the new cockpit height
                }

                // --- WEAPONS UPDATE ---
                if(weapon.isFiring && weapon.template && now - weapon.lastFired > weapon.fireRate) {
                    spawnBullet();
                    weapon.lastFired = now;
                }

                updateProjectiles();
            }

            renderer.render(scene, camera);
        });

        function spawnBullet() {
            const b = weapon.template.clone();
            const offset = new THREE.Vector3(0, -1.5, -3).applyQuaternion(playerGroup.quaternion);
            b.position.copy(playerGroup.position).add(offset);
            
            const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.getWorldQuaternion(new THREE.Quaternion()));
            b.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,-1), dir);
            
            scene.add(b);
            weapon.bullets.push({ mesh: b, vel: dir.multiplyScalar(4.0), life: 100 });
        }

        function fireMissile() {
            if(!missile.template) return;
            missile.lastFired = Date.now();
            
            const m = missile.template.clone();
            const sideOffset = 2.5 * missile.wingSide;
            const offset = new THREE.Vector3(sideOffset, -1.2, 1.0).applyQuaternion(playerGroup.quaternion);
            m.position.copy(playerGroup.position).add(offset);
            
            const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.getWorldQuaternion(new THREE.Quaternion()));
            m.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,-1), dir);
            
            scene.add(m);
            missile.active.push({ mesh: m, vel: dir.multiplyScalar(2.5), life: 200 });
            playOneShot(bufferLaunch, 0.6);
            missile.wingSide *= -1;
        }

        function updateProjectiles() {
            const now = Date.now();

            for(let i = weapon.bullets.length - 1; i >= 0; i--) {
                const b = weapon.bullets[i];
                b.mesh.position.add(b.vel);
                
                raycaster.set(b.mesh.position, b.vel.clone().normalize());
                const hits = raycaster.intersectObjects(collisionObjects);
                if(hits.length > 0 && hits[0].distance < 5) {
                    createExplosion(hits[0].point, 1.5);
                    scene.remove(b.mesh); weapon.bullets.splice(i, 1);
                } else if(--b.life <= 0) {
                    scene.remove(b.mesh); weapon.bullets.splice(i, 1);
                }
            }

            for(let i = missile.active.length - 1; i >= 0; i--) {
                const m = missile.active[i];
                m.mesh.position.add(m.vel);

                raycaster.set(m.mesh.position, m.vel.clone().normalize());
                const hits = raycaster.intersectObjects(collisionObjects);
                if(hits.length > 0 && hits[0].distance < 5) {
                    const p = hits[0].point;
                    createExplosion(p, 8.0);
                    const dist = camera.position.distanceTo(p);
                    setTimeout(() => playOneShot(bufferBoom, 1.0), (dist/343)*1000);
                    scene.remove(m.mesh); missile.active.splice(i, 1);
                } else if(--m.life <= 0) {
                    scene.remove(m.mesh); missile.active.splice(i, 1);
                }
            }

            for(let i = weapon.explosions.length - 1; i >= 0; i--) {
                const ex = weapon.explosions[i];
                if(now - ex.last > 30) {
                    if(++ex.frame > 6) {
                        scene.remove(ex.mesh); weapon.explosions.splice(i, 1);
                    } else {
                        ex.tex.offset.x = ex.frame / 7; ex.last = now;
                    }
                }
            }
        }

        function createExplosion(pos, scale) {
            const t = weapon.burstTexture.clone(); t.needsUpdate = true;
            const mat = new THREE.SpriteMaterial({ map: t, transparent: true, blending: THREE.AdditiveBlending });
            const s = new THREE.Sprite(mat);
            s.position.copy(pos);
            s.scale.set(scale, scale, scale);
            scene.add(s);
            weapon.explosions.push({ mesh: s, tex: t, frame: 0, last: Date.now() });
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
