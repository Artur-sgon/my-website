<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D VR Environment - Santos Dumont</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; font-family: 'VT323', monospace; touch-action: none; background: #000; }
        #loading { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: #000; color: white; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 1000;
        }
        #manual-vr-start {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 30px 60px; font-size: 2.5rem; font-family: 'VT323', monospace;
            background: #2ecc71; color: white; border: 5px solid #fff; border-radius: 15px;
            cursor: pointer; z-index: 2000; display: none; box-shadow: 0 0 40px rgba(46, 204, 113, 0.8);
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div id="loading">
        <h1 id="load-status">Downloading World...</h1>
    </div>

    <button id="manual-vr-start">Start VR Experience</button>

    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/loaders/DRACOLoader.js"></script>

    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        const playerGroup = new THREE.Group();
        playerGroup.position.set(155, 6, 8); 
        playerGroup.add(camera);
        scene.add(playerGroup);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.xr.enabled = true;
        renderer.outputEncoding = THREE.sRGBEncoding; 
        document.body.appendChild(renderer.domElement);

        const vrButton = document.getElementById('manual-vr-start');
        vrButton.addEventListener('click', () => {
            if (navigator.xr) {
                const sessionInit = { optionalFeatures: ['local-floor', 'bounded-floor'] };
                navigator.xr.requestSession('immersive-vr', sessionInit).then(async (session) => {
                    await renderer.xr.setSession(session);
                    renderer.xr.setReferenceSpaceType('local-floor');
                    vrButton.style.display = 'none';
                });
            }
        });

        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        const sun = new THREE.DirectionalLight(0xffffff, 0.8);
        sun.position.set(50, 50, 20);
        scene.add(sun);

        const manager = new THREE.LoadingManager();
        const statusText = document.getElementById('load-status');
        manager.onProgress = (url, l, t) => statusText.innerText = `Loading Assets: ${Math.round((l/t)*100)}%`;
        manager.onLoad = () => {
            document.getElementById('loading').style.display = 'none';
            vrButton.style.display = 'block';
        };

        const texLoader = new THREE.TextureLoader(manager);
        texLoader.setCrossOrigin('anonymous');
        texLoader.load('https://i.imgur.com/WN0Wmas.jpeg', (tex) => {
            tex.mapping = THREE.EquirectangularReflectionMapping;
            tex.encoding = THREE.sRGBEncoding;
            scene.background = tex;
            scene.environment = tex;
        });

        // --- PLAYER STATE ---
        const player = { 
            height: 1.6, 
            walkSpeed: 0.12, 
            runSpeed: 0.25,
            isRunning: false,
            velocity: 0, 
            gravity: -0.012, 
            jumpForce: 0.4,
            jumpCount: 0,
            maxJumps: 2,
            isGrounded: false, 
            stick: {x:0, y:0},
            // Latches for VR buttons to prevent "spamming"
            aButtonLatch: false,
            bButtonLatch: false
        };

        const raycaster = new THREE.Raycaster();
        let collisionObjects = [];

        const loader = new THREE.GLTFLoader(manager);
        const draco = new THREE.DRACOLoader();
        draco.setDecoderPath('https://www.gstatic.com/draco/v1/decoders/');
        loader.setDRACOLoader(draco);
        
        loader.load('https://cdn.jsdelivr.net/gh/Artur-sgon/my-website@main/santos_dumont_merged_clube_v3.gltf', (gltf) => {
            gltf.scene.scale.set(1.16, 1.16, 1.16);
            gltf.scene.traverse(n => { if(n.isMesh) collisionObjects.push(n); });
            scene.add(gltf.scene);
        });

        // --- VR RENDER LOOP ---
        renderer.setAnimationLoop(() => {
            const session = renderer.xr.getSession();
            if (session) {
                for (const source of session.inputSources) {
                    if (source.gamepad) {
                        const axes = source.gamepad.axes;
                        const buttons = source.gamepad.buttons;

                        // LEFT CONTROLLER: Move
                        if (source.handedness === 'left') {
                            player.stick.x = axes[2];
                            player.stick.y = axes[3];
                        }

                        // RIGHT CONTROLLER: Turn, Jump, Run
                        if (source.handedness === 'right') {
                            // Turning
                            if (Math.abs(axes[2]) > 0.7) {
                                playerGroup.rotation.y -= axes[2] * 0.05;
                            }

                            // A Button (Index 4) -> Jump
                            const aPressed = buttons[4].pressed;
                            if (aPressed && !player.aButtonLatch) {
                                if (player.isGrounded || player.jumpCount < player.maxJumps) {
                                    player.velocity = player.jumpForce;
                                    player.jumpCount++;
                                    player.isGrounded = false;
                                }
                                player.aButtonLatch = true; // Lock until released
                            } else if (!aPressed) {
                                player.aButtonLatch = false; // Reset latch
                            }

                            // B Button (Index 5) -> Toggle Run
                            const bPressed = buttons[5].pressed;
                            if (bPressed && !player.bButtonLatch) {
                                player.isRunning = !player.isRunning;
                                player.bButtonLatch = true;
                            } else if (!bPressed) {
                                player.bButtonLatch = false;
                            }
                        }
                    }
                }
            }

            // --- PHYSICS & GROUNDING ---
            raycaster.ray.origin.copy(playerGroup.position);
            raycaster.ray.direction.set(0, -1, 0);
            const groundHits = raycaster.intersectObjects(collisionObjects);
            player.isGrounded = groundHits.length > 0 && groundHits[0].distance < player.height + 0.1;

            if (player.isGrounded) {
                if (player.velocity < 0) {
                    player.velocity = 0;
                    player.jumpCount = 0; // Reset double jump on ground
                }
                playerGroup.position.y = groundHits[0].point.y + player.height;
            } else {
                player.velocity += player.gravity;
                playerGroup.position.y += player.velocity;
            }

            // --- MOVEMENT ---
            if (Math.abs(player.stick.x) > 0.1 || Math.abs(player.stick.y) > 0.1) {
                const currentSpeed = player.isRunning ? player.runSpeed : player.walkSpeed;
                
                const dir = new THREE.Vector3();
                camera.getWorldDirection(dir);
                dir.y = 0; dir.normalize();
                const side = new THREE.Vector3().crossVectors(new THREE.Vector3(0,1,0), dir).negate();
                
                playerGroup.position.addScaledVector(dir, -player.stick.y * currentSpeed);
                playerGroup.position.addScaledVector(side, player.stick.x * currentSpeed);
            }

            renderer.render(scene, camera);
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
