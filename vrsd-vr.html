<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Resilient VR Environment</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; font-family: 'VT323', monospace; background: #000; color: white; }
        #loading { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            background: rgba(0,0,0,0.9); padding: 30px; border: 2px solid #555; text-align: center; z-index: 1000;
        }
        #panic-btn { 
            display: none; margin-top: 15px; padding: 10px; background: #ff5555; color: white; 
            border: none; cursor: pointer; font-family: 'VT323'; font-size: 1.2rem;
        }
        #info {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); padding: 10px; border: 1px solid #555; z-index: 100; text-align: center;
        }
        #error-log { color: #ff5555; font-size: 0.9rem; margin-top: 10px; max-width: 300px; word-wrap: break-word; }
    </style>
</head>
<body>

    <div id="loading">
        <div id="status">Initializing Engine...</div>
        <div id="error-log"></div>
        <button id="panic-btn" onclick="document.getElementById('loading').style.display='none'">BYPASS LOADING SCREEN</button>
    </div>

    <div id="info">
        Stick/WASD: Move | SPACE/Button: Jump<br>
        Look for "ENTER VR" button at the bottom center.
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/loaders/DRACOLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/webxr/VRButton.js"></script>

    <script>
        // --- 1. Global Error Catcher ---
        const errorLog = document.getElementById('error-log');
        window.onerror = function(msg, url, line) {
            errorLog.innerHTML += `ERR: ${msg} (Line ${line})<br>`;
            document.getElementById('panic-btn').style.display = 'block';
        };

        // Show panic button after 5 seconds of hanging
        setTimeout(() => { document.getElementById('panic-btn').style.display = 'block'; }, 5000);

        // --- 2. Setup Scene ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 1000);
        const playerGroup = new THREE.Group();
        playerGroup.position.set(155, 6, 8);
        playerGroup.add(camera);
        scene.add(playerGroup);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.xr.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Correctly handle the VRButton namespace
        const vrButton = THREE.VRButton ? THREE.VRButton.createButton(renderer) : null;
        if (vrButton) document.body.appendChild(vrButton);

        // --- 3. Asset Loading ---
        const manager = new THREE.LoadingManager();
        const status = document.getElementById('status');
        
        manager.onProgress = (url, loaded, total) => {
            status.innerText = `Loading Assets: ${Math.round((loaded/total)*100)}%`;
        };
        manager.onLoad = () => { document.getElementById('loading').style.display = 'none'; };
        manager.onError = (url) => { errorLog.innerHTML += `Failed: ${url.split('/').pop()}<br>`; };

        // Sky/Environment
        new THREE.TextureLoader(manager).load('https://i.imgur.com/WN0Wmas.jpeg', (tex) => {
            tex.mapping = THREE.EquirectangularReflectionMapping;
            scene.background = tex;
            scene.environment = tex;
        });

        // Lights
        scene.add(new THREE.AmbientLight(0xffde77, 0.5));
        const sun = new THREE.DirectionalLight(0xffff86, 0.8);
        sun.position.set(50, 50, -20);
        scene.add(sun);

        // Model Loading
        const draco = new THREE.DRACOLoader();
        draco.setDecoderPath('https://www.gstatic.com/draco/v1/decoders/');
        
        const loader = new THREE.GLTFLoader(manager);
        loader.setDRACOLoader(draco);

        let collisionObjects = [];
        const modelUrl = 'https://cdn.jsdelivr.net/gh/Artur-sgon/my-website@main/santos_dumont_merged_clube_v3.gltf';
        
        loader.load(modelUrl, (gltf) => {
            gltf.scene.scale.set(1.1, 1.1, 1.1);
            gltf.scene.traverse(n => { if(n.isMesh) collisionObjects.push(n); });
            scene.add(gltf.scene);
        });

        // --- 4. Animation Loop & Movement ---
        const player = { velocity: new THREE.Vector3(), keys: {}, stick: {x:0, y:0} };

        // Basic Keyboard Controls
        window.addEventListener('keydown', e => player.keys[e.code] = true);
        window.addEventListener('keyup', e => player.keys[e.code] = false);

        renderer.setAnimationLoop(() => {
            // VR Controller Input
            const session = renderer.xr.getSession();
            if (session) {
                for (const source of session.inputSources) {
                    if (source.gamepad) {
                        const axes = source.gamepad.axes;
                        if (source.handedness === 'left') {
                            player.stick.x = axes[2]; player.stick.y = axes[3];
                        }
                    }
                }
            }

            // Movement logic
            const moveZ = (Number(player.keys['KeyS'] || 0) - Number(player.keys['KeyW'] || 0)) || player.stick.y;
            const moveX = (Number(player.keys['KeyD'] || 0) - Number(player.keys['KeyA'] || 0)) || player.stick.x;
            
            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            dir.y = 0; dir.normalize();
            const side = new THREE.Vector3().crossVectors(new THREE.Vector3(0,1,0), dir).negate();

            playerGroup.position.addScaledVector(dir, -moveZ * 0.1);
            playerGroup.position.addScaledVector(side, moveX * 0.1);

            renderer.render(scene, camera);
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
