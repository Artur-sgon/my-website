<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Missile Explosion Test Bench</title>
    <style>
        body { margin: 0; overflow: hidden; background: #333; font-family: monospace; color: white; }
        #canvas { width: 100%; height: 100vh; display: block; }
        
        #ui {
            position: absolute; top: 10px; left: 10px;
            background: rgba(0, 0, 0, 0.8); padding: 15px;
            border: 1px solid #555; border-radius: 8px;
            pointer-events: auto; min-width: 250px;
        }
        .row { margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        label { margin-right: 10px; flex: 1; }
        input[type=range] { cursor: pointer; flex: 2; margin: 0 10px; }
        .val { width: 40px; text-align: right; color: #ffaa00; font-weight: bold; }
        
        h1 { margin: 0 0 15px 0; font-size: 1.2rem; color: #ffaa00; text-align: center; border-bottom: 1px solid #555; padding-bottom: 5px; }
        .hint { font-size: 0.8rem; color: #aaa; text-align: center; margin-top: 15px; border-top: 1px solid #555; padding-top: 5px; }
    </style>
</head>
<body>

    <div id="ui">
        <h1>Explosion Tuner</h1>
        <div class="row">
            <label>Count:</label>
            <input type="range" id="p-count" min="10" max="200" value="50">
            <span class="val" id="val-count">50</span>
        </div>
        <div class="row">
            <label>Speed:</label>
            <input type="range" id="p-speed" min="0.1" max="5.0" step="0.1" value="0.8">
            <span class="val" id="val-speed">0.8</span>
        </div>
        <div class="row">
            <label>Size:</label>
            <input type="range" id="p-size" min="0.5" max="10.0" step="0.1" value="2.0">
            <span class="val" id="val-size">2.0</span>
        </div>
        <div class="row">
            <label>Decay:</label>
            <input type="range" id="p-decay" min="0.005" max="0.1" step="0.001" value="0.03">
            <span class="val" id="val-decay">0.03</span>
        </div>
        <div class="row">
            <label>Gravity:</label>
            <input type="range" id="p-grav" min="-0.05" max="0.05" step="0.001" value="0.01">
            <span class="val" id="val-grav">0.01</span>
        </div>
        <div class="hint">[SPACE] to Explode<br>Mouse to Orbit</div>
    </div>

    <canvas id="canvas"></canvas>

    <!-- Three.js + OrbitControls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/OrbitControls.js"></script>

    <script>
        // --- SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x333333); 
        
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 10, 20);

        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas'), antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);

        // Controls
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // Lights
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
        scene.add(hemiLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // --- PROCEDURAL GROUND TEXTURE ---
        function createCheckeredTexture() {
            const size = 512;
            const canvas = document.createElement('canvas');
            canvas.width = size; canvas.height = size;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = '#5C4033'; 
            ctx.fillRect(0, 0, size, size);
            
            ctx.fillStyle = '#8B4513'; 
            const checkSize = 64;
            for (let y = 0; y < size; y += checkSize) {
                for (let x = 0; x < size; x += checkSize) {
                    if ((x / checkSize + y / checkSize) % 2 === 0) {
                        ctx.fillRect(x, y, checkSize, checkSize);
                    }
                }
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(10, 10);
            return tex;
        }

        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(100, 100),
            new THREE.MeshStandardMaterial({ map: createCheckeredTexture(), roughness: 0.8 })
        );
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        // --- PROCEDURAL PARTICLE TEXTURE ---
        function createParticleTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 32; canvas.height = 32;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
            grad.addColorStop(0, 'rgba(255, 200, 50, 1)'); 
            grad.addColorStop(0.4, 'rgba(200, 100, 0, 0.8)'); 
            grad.addColorStop(1, 'rgba(0, 0, 0, 0)'); 
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 32, 32);
            return new THREE.CanvasTexture(canvas);
        }

        // ==========================================
        // === EXPLOSION SYSTEM ===
        // ==========================================
        const ExplosionSystem = {
            particles: [],
            texture: createParticleTexture(), 
            
            config: {
                count: 50,
                speed: 0.8,
                size: 2.0,
                decay: 0.03,
                gravity: 0.01
            },

            trigger: function(position) {
                for (let i = 0; i < this.config.count; i++) {
                    const mat = new THREE.SpriteMaterial({ 
                        map: this.texture, 
                        color: 0xffffff, 
                        transparent: true, 
                        opacity: 1,
                        blending: THREE.AdditiveBlending,
                        depthWrite: false
                    });

                    const sprite = new THREE.Sprite(mat);
                    sprite.position.copy(position);
                    
                    const s = this.config.size * (0.5 + Math.random() * 0.5);
                    sprite.scale.set(s, s, s);

                    scene.add(sprite);

                    // Random Direction
                    const velocity = new THREE.Vector3(
                        (Math.random() - 0.5), 
                        (Math.random() - 0.5), 
                        (Math.random() - 0.5)
                    ).normalize().multiplyScalar(this.config.speed * (0.5 + Math.random() * 0.5));

                    this.particles.push({
                        mesh: sprite,
                        velocity: velocity,
                        life: 1.0
                    });
                }
            },

            update: function() {
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const p = this.particles[i];

                    // Physics
                    p.mesh.position.add(p.velocity);
                    p.velocity.multiplyScalar(0.95); // Friction
                    p.velocity.y += this.config.gravity;

                    // Size/Fade
                    p.mesh.scale.multiplyScalar(1.05);
                    p.life -= this.config.decay;
                    p.mesh.material.opacity = p.life;

                    if (p.life <= 0) {
                        scene.remove(p.mesh);
                        p.mesh.material.dispose();
                        this.particles.splice(i, 1);
                    }
                }
            }
        };

        // --- INPUT HANDLING ---
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                ExplosionSystem.trigger(new THREE.Vector3(0, 0.5, 0));
            }
        });

        // --- UI BINDING ---
        function bindInput(id, valId, key, parse) {
            const el = document.getElementById(id);
            const valEl = document.getElementById(valId);
            el.addEventListener('input', (e) => {
                const v = parse(e.target.value);
                ExplosionSystem.config[key] = v;
                valEl.textContent = v;
            });
        }

        bindInput('p-count', 'val-count', 'count', parseInt);
        bindInput('p-speed', 'val-speed', 'speed', parseFloat);
        bindInput('p-size', 'val-size', 'size', parseFloat);
        bindInput('p-decay', 'val-decay', 'decay', parseFloat);
        bindInput('p-grav', 'val-grav', 'gravity', parseFloat);

        // --- ANIMATION LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            ExplosionSystem.update(); 
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
